# 仓位分配与风控阈值
# 注意：本文件受「冷静期」约束（SPEC §10.3）——
#   全部改动都让风控更严格 → 次日生效；
#   只要有一项更宽松    → 下一个自然周的周一才生效。

# 可用现金，需手动维护。总资产 = 全部持仓市值 + cash。
cash: 0

allocation:
  base: 0.5    # 底仓目标占比
  swing: 0.5   # 波段仓目标占比

swing:
  max_positions: 5                   # 同时持有的波段仓上限（R4）
  risk_per_trade: 0.01               # 单笔风险预算占总资产比例（R6）；neutral 档减半
  min_trade_amount: 5000             # 低于此金额不生成买入（R10）
  cooldown_days_after_stop: 10       # 止损后冷却交易日数（R8）
  circuit_breaker_drawdown: 0.10     # 波段仓净值自 60 日高点回撤触发熔断（R9）
  circuit_breaker_days: 10
  no_averaging_down: true            # 禁止亏损补仓（R7）

stops:
  atr_mult: 2.0        # 初始止损 = entry - atr_mult × ATR14，与前低取较近者（X1）
  max_stop_pct: 0.10   # 止损距离超过此比例则放弃入场（X2）

# 波段仓总市值上限 = 总资产 × allocation.swing × 档位系数（R12）
regime_caps: {attack: 1.0, neutral: 0.5, defense: 0.0}

sector_filter:
  enabled: true   # 行业排名后 1/3 时买入降级为 watch（R3b）
